[package]
name = "q"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-markdown = "0.3"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v7"] }

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
syn = "2"
typify = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
